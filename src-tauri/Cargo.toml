[package]
name = "sidedeck"
version = "0.1.0-alpha.1"
description = "System and AI activity dashboard for secondary displays"
authors = ["Rayman Zhang"]
license = "AGPL-3.0-only"
repository = "https://github.com/raymanzhang/SideDeck"
homepage = "https://github.com/raymanzhang/SideDeck"
edition = "2021"

[lib]
name = "sidedeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sidedeck"
path = "src/main.rs"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.33"
battery = "0.7"
notify = "7"
chrono = { version = "0.4", default-features = false, features = ["std"] }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
security-framework = "3"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
